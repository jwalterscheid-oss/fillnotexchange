name: Decode catalog PNG

on:
  push:
    paths:
      - "keepthetank.svg"
      - ".github/workflows/decode-catalog-png.yml"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: decode-catalog-png
  cancel-in-progress: true

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rasterize SVG to PNG and commit if changed
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 1200 -h 630 keepthetank.svg -o keepthetank.png
          file keepthetank.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keepthetank.png
          if git diff --cached --quiet; then
            echo "PNG unchanged"
          else
            git commit -m "Add Keep the Tank catalog PNG for X Shopping"
            git push
          fi
